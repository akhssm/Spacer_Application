# Render Blueprint: the frontend as a static site (https://render.com/docs/blueprint-spec).
services:
  - type: web
    runtime: static
    name: spacer-application
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # MapTiler key for the satellite maps. Render asks for its value when the Blueprint is
      # created; it is read at build time, so changing it later needs a redeploy.
      - key: VITE_MAPTILER_KEY
        sync: false
    routes:
      # Single-page app: any path that is not a real file (e.g. /ira-towers/explore/A/03/A-0305)
      # serves index.html, so refreshing or opening a deep link works.
      - type: rewrite
        source: /*
        destination: /index.html
