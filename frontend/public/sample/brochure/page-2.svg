<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <rect width="1200" height="1200" fill="#f4f1e8"/>
  <text x="80" y="200" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#14261d">About the project</text>
  <rect x="80" y="228" width="120" height="6" fill="#8a6d2f"/>
  <text x="80" y="320" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64">Green Meadows is a sample plotted layout used to show</text>
  <text x="80" y="376" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64">how a brochure appears inside the Spacer viewer.</text>
  <text x="80" y="432" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64"></text>
  <text x="80" y="488" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64">Replace these pages with your own brochure. Each page</text>
  <text x="80" y="544" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64">is one image, and the viewer turns them like a book.</text>
  <text x="80" y="600" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64"></text>
  <text x="80" y="656" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="30" fill="#5f6b64">Square pages look best, but any size works.</text>
  <text x="80" y="1130" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="22" fill="#5f6b64">Green Meadows · Sample brochure</text>
  <text x="1120" y="1130" font-family="'Inria Sans', 'Segoe UI', sans-serif" font-size="22" fill="#5f6b64" text-anchor="end">2</text>
</svg>
